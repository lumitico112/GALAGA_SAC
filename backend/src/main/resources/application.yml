spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/galaga_db}
    username: ${DB_USERNAME:galaga_user}
    password: ${DB_PASSWORD:galaga_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:407A4672527757785367566B59703373367639792F423F4528482B4D62516554}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
