spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/galaga_db
    username: galaga_user
    password: galaga_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
